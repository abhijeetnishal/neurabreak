name: Build macOS DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS .app + DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra ai --extra audio --extra data --extra system

      - name: Install build tools
        run: |
          uv run pip install pyinstaller
          brew install create-dmg

      - name: Build macOS DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuraBreak-macOS-DMG
          path: packaging/macos/dist/*.dmg
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/macos/dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
